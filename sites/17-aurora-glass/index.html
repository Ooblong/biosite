<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#060a1c">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--k-bg:#0d1430;--k-fg:#eef2ff;--k-muted:#b4bddc;--k-accent:#eef2ff;--k-on:#0b1026;--k-line:rgba(255,255,255,.3);--k-r:14px;--k-font:"Albert Sans",sans-serif;--k-display:"DM Serif Display",serif;--k-field:rgba(255,255,255,.07);--k-ok:#9df5d5;--k-err:#ffb8c4}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:#eef2ff;font:400 15.5px/1.5 "Albert Sans",sans-serif;background:#060a1c;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.fallback{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 20% 20%,#1fd1b4aa,transparent),radial-gradient(60% 50% at 80% 30%,#7b4dffaa,transparent),radial-gradient(70% 60% at 50% 90%,#ff4f9a66,transparent),#060a1c}
.col{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));display:grid;gap:14px}
.glass{position:relative;padding:20px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*90ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}
.me{text-align:center;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.av{width:104px;height:104px;margin:0 auto 14px;display:grid;place-items:center;font:400 40px "DM Serif Display",serif;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);overflow:hidden;backdrop-filter:blur(10px)}
.av img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font:400 clamp(46px,13vw,64px)/1 "DM Serif Display",serif;letter-spacing:-.01em}
h1 em{font-style:italic;color:#c8f5ea}
h2{margin:0 0 6px;font:400 34px/1.05 "DM Serif Display",serif}
.me p{margin:10px auto 0;max-width:32em;color:#cfd6f0}
.socs{display:flex;justify-content:center;gap:8px;margin-top:14px}
.socs .k-soc{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.feat{padding:0;overflow:hidden;transform-style:preserve-3d}
.feat .shine{position:absolute;inset:0;pointer-events:none;border-radius:24px;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.16),transparent 45%)}
.feat .pad{padding:20px}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips span{padding:3px 10px;font-size:12.5px;font-weight:600;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.chips span:first-child{color:#0b1026;background:#c8f5ea;border-color:transparent}
.glass p{margin:0 0 10px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;margin:14px 0 8px;font-weight:600;font-size:16.5px;color:#0b1026;background:#fff;border:0;border-radius:16px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.sm{font-size:13.5px;color:#b4bddc}
.pg{--pg-bg:rgba(6,10,28,.55);--pg-fg:#eef2ff;--pg-mut:#b4bddc;--pg-line:rgba(255,255,255,.18);--pg-acc:#c8f5ea;--pg-on:#0b1026;--pg-r:0;--pg-font:"Albert Sans",sans-serif;border-width:1px 0}
.lk{display:grid;gap:8px}
.lk>*{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px;padding:6px 18px;font:inherit;font-weight:500;text-align:left;color:inherit;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;transition:background .2s}
.lk a:hover,.lk button:hover{background:rgba(255,255,255,.14)}
.lk>*:first-child{background:rgba(200,245,234,.18);border-color:rgba(200,245,234,.45);cursor:pointer}
.lk small{color:#b4bddc;font-size:12.5px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#9df5d5;box-shadow:0 0 0 0 rgba(157,245,213,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(157,245,213,0)}100%{box-shadow:0 0 0 0 rgba(157,245,213,0)}}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px;font-size:13.5px;color:#b4bddc}
.foot a{min-height:44px;display:inline-flex;align-items:center}
@media(min-width:900px){.col{max-width:540px;padding-top:70px}}
@media(prefers-reduced-motion:reduce){.glass{animation:none;opacity:1;transform:none}.dot{animation:none}}
</style>
</head>
<body>
<div class="fallback"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<main class="col">
  <header class="glass me" style="--i:0"><div class="av" data-av></div><h1><span data-t="person.first"></span> <em data-t="person.last"></em></h1><p data-t="person.bio"></p><div class="socs" data-soc></div></header>
  <section class="glass feat" id="feat" style="--i:1"><i class="shine"></i>
    <div class="pad"><div class="chips"><span data-t="product.price"></span><span data-t="product.compat"></span></div>
    <h2 data-t="product.name"></h2><p data-t="product.description"></p><p class="sm" data-t="product.promise"></p></div>
    <div data-demo></div>
    <div class="pad" style="padding-top:6px"><ul data-details></ul><button class="cta" data-get>Get it free <span aria-hidden="true">→</span></button><p class="sm" style="margin:0" data-t="product.compatNote"></p></div>
  </section>
  <section class="glass" style="--i:2"><h2>Links</h2><div class="lk" id="links"></div></section>
  <section class="glass" style="--i:3"><p class="sm"><span class="dot"></span>Currently building</p><h2 data-t="building.name"></h2><p data-t="building.status"></p><a data-build-link>Follow the journey</a></section>
  <section class="glass" style="--i:4"><h2>Newsletter</h2><p data-t="newsletter.intro"></p><div data-form="newsletter"></div></section>
  <footer class="foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span style="align-self:center" data-t="footer.credit"></span></footer>
</main>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,S,link,esc,reduced}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<span>${esc(l.label)}</span><small>${esc(l.note)}</small>`)).join('');
const f=$('#feat');f.addEventListener('pointermove',e=>{const r=f.getBoundingClientRect();f.style.setProperty('--mx',e.clientX-r.left+'px');f.style.setProperty('--my',e.clientY-r.top+'px')});
// Aurora: a small fragment shader, pointer bends the ribbons
(function(){const cv=$('#gl'),gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false});if(!gl)return;
 const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';
 const fs=`precision mediump float;uniform vec2 r;uniform float t;uniform vec2 m;
 float n(vec2 p){return sin(p.x)*cos(p.y);}
 float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(1.6,1.2,-1.2,1.6)*p+t*.05;a*=.5;}return v;}
 void main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=uv;q.x*=r.x/r.y;
  q+=(m-.5)*.25*vec2(1.,-1.);
  float f=fbm(q*2.2+vec2(0.,t*.08));
  float band1=smoothstep(.22,0.,abs(uv.y-.68-f*.35));
  float band2=smoothstep(.18,0.,abs(uv.y-.42-f*.28+.06*sin(q.x*3.+t*.2)));
  vec3 c=vec3(.024,.04,.11);
  c+=band1*mix(vec3(.12,.82,.7),vec3(.48,.3,1.),uv.x)*.85;
  c+=band2*mix(vec3(1.,.31,.6),vec3(.3,.5,1.),uv.x+f)*.5;
  c+=.05*fbm(q*8.+t*.1);
  gl_FragColor=vec4(c,1.);}`;
 const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t'),um=gl.getUniformLocation(pr,'m');
 let mx=.5,my=.5,tx=.5,ty=.5;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=e.clientY/innerHeight},{passive:true});
 function size(){const s=Math.min(1,devicePixelRatio)*.6;cv.width=innerWidth*s;cv.height=innerHeight*s;gl.viewport(0,0,cv.width,cv.height)}size();addEventListener('resize',size);
 const t0=performance.now();function fr(now){mx+=(tx-mx)*.05;my+=(ty-my)*.05;gl.uniform2f(ur,cv.width,cv.height);gl.uniform1f(ut,reduced?20:(now-t0)/1000);gl.uniform2f(um,mx,my);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);if(!reduced&&!document.hidden)requestAnimationFrame(fr);else if(!reduced)setTimeout(()=>requestAnimationFrame(fr),500)}
 requestAnimationFrame(fr);})();
</script>
</body>
</html>
