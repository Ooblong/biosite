<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#ff4b23">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--k-bg:#fff;--k-fg:#16130f;--k-muted:#5c574f;--k-accent:#16130f;--k-on:#fff;--k-line:#16130f;--k-r:14px;--k-font:"Bricolage Grotesque",sans-serif;--k-display:"Bricolage Grotesque",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#101010;font-family:"Bricolage Grotesque",sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.stage{position:relative;height:100dvh;max-width:480px;margin:auto;overflow:hidden;background:#000;user-select:none}
.bars{position:absolute;z-index:6;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden}
.bars i b{display:block;height:100%;width:100%;background:#fff;transform:scaleX(var(--p,0));transform-origin:0 50%}
.who{position:absolute;z-index:6;left:12px;right:8px;top:calc(22px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:15px}
.who .av{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:#16130f;background:#fff;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #fff6}
.who .av img{width:100%;height:100%;object-fit:cover}
.who .pause{margin-left:auto;width:44px;height:44px;font-size:15px;background:none;border:0;color:#fff;cursor:pointer}
.story{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(84px + env(safe-area-inset-top)) 22px calc(90px + env(safe-area-inset-bottom));color:var(--c,#fff);background:var(--b);visibility:hidden;opacity:0;transform:scale(1.03);transition:opacity .28s,transform .4s cubic-bezier(.2,.8,.2,1),visibility .28s;overflow:hidden}
.story.on{visibility:visible;opacity:1;transform:none}
.story h1,.story h2{margin:0;font-weight:800;letter-spacing:-.045em;line-height:.9}
.story h1{font-size:clamp(82px,25vw,124px)}
.story h2{font-size:clamp(56px,16.5vw,84px)}
.story p{margin:14px 0 0;font-size:19px;line-height:1.28;font-weight:400}
.ln{display:block;opacity:0;transform:translateY(34px) rotate(1.5deg)}
.story.on .ln{opacity:1;transform:none;transition:opacity .5s,transform .7s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--d,0)*90ms + 120ms)}
.pill{display:inline-block;padding:7px 14px;font-weight:800;font-size:17px;color:var(--pc,#16130f);background:var(--pb,#fff);border-radius:99px;margin-right:6px}
.pill.alt{background:none;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.socs{display:flex;gap:8px;margin-top:18px;position:relative;z-index:5}
.socs .k-soc{width:52px;height:52px;background:rgba(255,255,255,.2);border-radius:50%}
.cta{position:relative;z-index:5;display:block;width:100%;min-height:64px;margin-top:18px;font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--pc,#16130f);background:var(--pb,#fff);border:0;border-radius:18px;cursor:pointer}
.small{font-size:15px!important}
.interact{position:relative;z-index:5}
.peek{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:26px;padding:12px 14px 12px 16px;text-align:left;color:#16130f;background:#fff;border:0;border-radius:18px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.peek b{display:block;font-size:20px;letter-spacing:-.02em}.peek small{font-size:14px}.peek i{font-style:normal;font-size:24px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#ff2d78}
.pg{--pg-r:16px;--pg-acc:#1c2bff;margin-top:12px;--pg-font:"Bricolage Grotesque",sans-serif}
.lk{display:grid;gap:8px;margin-top:16px}
.lk>*{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;padding:6px 16px;font-weight:600;font-size:19px;color:inherit;text-decoration:none;background:rgba(255,255,255,.14);border:0;border-radius:14px;text-align:left}
.lk>.feat{color:#16130f;background:#fff;cursor:pointer}
.lk small{font-size:13px;font-weight:400;white-space:nowrap}
.foot{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:18px;font-size:14px;align-items:center}
.foot a{color:inherit;min-height:44px;display:inline-flex;align-items:center}
.zone{position:absolute;z-index:4;top:0;bottom:0;width:32%;background:none;border:0;cursor:pointer;padding:0;opacity:0}
.zone.l{left:0}.zone.r{right:0;width:68%}
.hintb{position:absolute;z-index:6;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:13px;opacity:.9;pointer-events:none}
.nope .zone{display:none}
.nav{display:none}
@media(min-width:900px){
 body{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2522,#0d0c0b)}
 .stage{width:min(56vh,430px);height:min(92vh,800px);border-radius:26px;box-shadow:0 30px 90px #000}
 .nav{display:block;position:fixed;top:50%;width:56px;height:56px;margin-top:-28px;font-size:24px;color:#fff;background:#ffffff22;border:0;border-radius:50%;cursor:pointer}
 .nav.p{left:calc(50% - 300px)}.nav.n{right:calc(50% - 300px)}
}
@media(prefers-reduced-motion:reduce){.story,.ln{transition:none!important;transform:none!important}.ln{opacity:1}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="who"><span class="av" data-av></span><span data-t="person.name"></span><button class="pause" id="pause" aria-label="Pause">❚❚</button></div>

  <section class="story" style="--b:linear-gradient(170deg,#ff4b23,#ff2d78)">
    <h1><span class="ln" data-t="person.first"></span><span class="ln" style="--d:1;letter-spacing:-.06em;font-size:.72em" data-t="person.last"></span></h1>
    <p class="ln" style="--d:2" data-t="person.bio"></p>
    <div class="socs ln" style="--d:3" data-soc></div>
    <button class="peek ln" style="--d:4" data-jump="1"><span><b data-t="product.name"></b><small><span data-t="product.price"></span> · <span data-t="product.compat"></span></small></span><i aria-hidden="true">→</i></button>
  </section>

  <section class="story" style="--b:linear-gradient(170deg,#1c2bff,#6b1dff);--pb:#e6ff3f;--pc:#120f3a">
    <p class="ln"><span class="pill" data-t="product.price"></span><span class="pill alt" data-t="product.compat"></span></p>
    <h2 class="ln" style="--d:1;margin-top:14px" data-t="product.name"></h2>
    <p class="ln" style="--d:2" data-t="product.description"></p>
    <p class="ln" style="--d:3;font-weight:800" data-t="product.promise"></p>
    <ul data-details class="ln small" style="--d:3"></ul>
    <button class="cta ln" style="--d:4" data-get>Get it free</button>
    <p class="small ln" style="--d:5" data-t="product.compatNote"></p>
  </section>

  <section class="story" data-stay style="--b:#e6ff3f;--c:#16130f;--pb:#16130f;--pc:#e6ff3f">
    <h2 style="font-size:46px" class="ln">Try the preview</h2>
    <div class="interact ln" style="--d:1" data-demo></div>
    <button class="cta ln" style="--d:2;min-height:54px;font-size:20px;margin-top:10px" data-get>Get it free</button>
  </section>

  <section class="story" style="--b:linear-gradient(170deg,#04523f,#0a9a6a)">
    <h2 class="ln">Links</h2>
    <div class="lk interact ln" style="--d:1" id="links"></div>
  </section>

  <section class="story" style="--b:linear-gradient(170deg,#ffb700,#ff7a00);--c:#2a1500">
    <p class="ln" style="font-weight:800">Currently building</p>
    <h2 class="ln" style="--d:1;margin-top:10px" data-t="building.name"></h2>
    <p class="ln" style="--d:2" data-t="building.status"></p>
    <a class="ln interact" style="--d:3;color:inherit;margin-top:12px" data-build-link>Follow the journey</a>
  </section>

  <section class="story" data-stay style="--b:linear-gradient(170deg,#16130f,#3a2c4a);--k-fg:#fff;--k-line:#fff;--k-muted:#ddd;--k-accent:#fff;--k-on:#16130f;--k-err:#ffb4a8;--k-ok:#e6ff3f">
    <h2 class="ln">Newsletter</h2>
    <p class="ln" style="--d:1" data-t="newsletter.intro"></p>
    <div class="interact ln" style="--d:2;margin-top:14px" data-form="newsletter"></div>
    <div class="foot interact ln" style="--d:3"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span data-t="footer.credit"></span></div>
  </section>

  <button class="zone l" id="zl" aria-label="Previous story"></button>
  <button class="zone r" id="zr" aria-label="Next story"></button>
  <p class="hintb" id="hb">Tap to continue</p>
</main>
<button class="nav p" id="np" aria-label="Previous story">←</button>
<button class="nav n" id="nn" aria-label="Next story">→</button>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,$$,S,link,esc,reduced}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<span>${esc(l.label)}</span><small>${esc(l.note)}</small>`,l.featured?'feat':'')).join('');
const st=$$('.story');$('#bars').innerHTML=st.map(()=>'<i><b></b></i>').join('');
const bars=$$('#bars b');const DUR=7000;let i=0,t=0,last=0,paused=reduced;
function show(n){n=Math.max(0,Math.min(st.length-1,n));i=n;t=0;st.forEach((s,k)=>{s.classList.toggle('on',k===i);s.inert=k!==i});
 bars.forEach((b,k)=>b.style.setProperty('--p',k<i?1:0));
 const stay=st[i].hasAttribute('data-stay');$('#stage').classList.toggle('nope',stay);
 $('#hb').textContent=stay?(i===st.length-1?'End. Swipe right to go back':'Swipe left to continue'):'Tap to continue'}
function loop(ts){const d=ts-last;last=ts;const s=st[i];
 const busy=paused||document.hidden||s.hasAttribute('data-stay')||holding||$('dialog[open]')||s.contains(document.activeElement)&&document.activeElement.matches('input,button:not(.zone)');
 if(!busy&&i<st.length-1){t+=d;if(t>=DUR)show(i+1)}
 if(s.hasAttribute('data-stay')){bars[i].style.setProperty('--p',1)}else bars[i].style.setProperty('--p',Math.min(1,t/DUR));
 requestAnimationFrame(loop)}
let holding=false,moved=0,downT=0;
$('#zr').onclick=()=>{if(performance.now()-downT<320)show(i+1)};$('#zl').onclick=()=>{if(performance.now()-downT<320)show(i-1)};
document.addEventListener('click',e=>{const j=e.target.closest('[data-jump]');if(j)show(+j.dataset.jump)});
$('#nn').onclick=()=>show(i+1);$('#np').onclick=()=>show(i-1);
$$('.zone').forEach(z=>{z.addEventListener('pointerdown',()=>{holding=true;downT=performance.now()});['pointerup','pointercancel','pointerleave'].forEach(n=>z.addEventListener(n,()=>holding=false))});
$('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'❚❚';e.currentTarget.setAttribute('aria-label',paused?'Play':'Pause')};
if(reduced){$('#pause').textContent='▶'}
let sx=0,sy=0;const stg=$('#stage');
stg.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stg.addEventListener('touchend',e=>{if(e.target.closest('input'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){show(i+(dx<0?1:-1))}},{passive:true});
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(i+1)}if(e.key==='ArrowLeft')show(i-1)});
window.BIO_QA=async()=>{paused=true};window.BIO_GOTO=show;
show(0);requestAnimationFrame(ts=>{last=ts;loop(ts)});
</script>
</body>
</html>
