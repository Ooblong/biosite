<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#3b2416">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Abril+Fatface&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--wood:#7a4a2a;--wood2:#5b341c;--brass:#d6ad5c;--card:#fbf8ef;--ink:#232020;--red:#c8392b;
--k-bg:#fbf8ef;--k-fg:#232020;--k-muted:#5e5752;--k-accent:#232020;--k-on:#fbf8ef;--k-line:#232020;--k-r:3px;--k-font:"Courier Prime",monospace;--k-display:"Abril Fatface",serif;--k-field:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:var(--ink);font:16px/1.4 "Courier Prime",monospace;background:#2a1a10 radial-gradient(circle at 50% 0,#4a2e1c,#1c110a 70%)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{max-width:560px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px 12px;color:#f5e6c8;text-align:center}
.top .av{width:84px;height:84px;margin:0 auto 10px;display:grid;place-items:center;font:400 34px "Abril Fatface",serif;color:var(--ink);background:var(--card);border-radius:50%;border:4px solid var(--brass);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font:400 clamp(38px,11vw,56px)/1 "Abril Fatface",serif;letter-spacing:.01em}
.top p{margin:8px auto 0;max-width:30em;font-size:15px;color:#e9d7b5}
.socs{display:flex;justify-content:center;gap:4px;color:var(--brass);margin-top:4px}
.cab{max-width:560px;margin:10px auto 0;padding:12px;background:linear-gradient(90deg,#000 0 1px,transparent 1px) 0 0/9px 100%,linear-gradient(var(--wood),var(--wood2));border-radius:8px;box-shadow:inset 0 0 0 4px #4a2b16,0 30px 60px rgba(0,0,0,.6)}
.drawer{margin:0 0 10px;perspective:900px}
.drawer:last-child{margin:0}
.front{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;min-height:78px;padding:10px 14px;background:linear-gradient(180deg,#8d5833,#6c3f22);border:0;border-radius:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 #3a210f;cursor:pointer;transition:transform .45s cubic-bezier(.3,1.3,.5,1);z-index:2}
.holder{grid-column:2;min-width:160px;padding:5px 14px;font:400 15px "Special Elite",monospace;color:var(--ink);background:var(--card);border:3px solid var(--brass);border-radius:3px;box-shadow:inset 0 0 0 1px #9a7a3a}
.pull{grid-column:2;justify-self:center;margin-top:6px;width:54px;height:12px;border-radius:0 0 30px 30px;border:3px solid var(--brass);border-top:0}
.front small{grid-column:3;justify-self:end;font:400 13px "Special Elite";color:#f3dcb2}
.front small:first-child{grid-column:1;justify-self:start}
.drawer.open .front{transform:translateY(4px) scale(1.02)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,1,.4,1)}
.drawer.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden;background:linear-gradient(#3a2212,#2c190c);border-radius:0 0 6px 6px;margin:0 6px}
.cards{padding:14px 10px 8px;display:grid;gap:0}
.card{position:relative;padding:18px 16px 16px;background:var(--card);background-image:linear-gradient(transparent 31px,#bcd3e8 32px);background-size:100% 26px;background-position:0 6px;border-radius:3px;box-shadow:0 -2px 6px rgba(0,0,0,.3);transform:translateY(30px);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .3s}
.card+.card{margin-top:-6px}
.card:before{content:"";position:absolute;left:0;right:0;top:30px;height:2px;background:var(--red);opacity:.7}
.drawer.open .card{transform:none;opacity:1;transition-delay:.15s}
.card h2{margin:0 0 16px;font:400 24px/1.1 "Special Elite",monospace}
.card p{margin:0 0 10px;line-height:26px}
.call{position:absolute;right:12px;top:8px;font:400 12px "Special Elite";color:var(--red)}
.stamp{display:inline-block;padding:2px 10px;margin-right:6px;font:400 15px "Special Elite";color:var(--red);border:2px solid var(--red);border-radius:3px;transform:rotate(-3deg)}
.btn{display:block;width:100%;min-height:56px;margin:12px 0 8px;font:400 20px "Special Elite",monospace;color:var(--card);background:var(--ink);border:0;border-radius:3px;cursor:pointer}
.sm{font-size:13.5px;color:#5e5752;line-height:1.4!important}
.pg{--pg-bg:#fff;--pg-r:3px;--pg-acc:#c8392b;--pg-font:"Courier Prime",monospace;margin:10px 0}
.lk>*{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;min-height:52px;padding:13px 0 0;font:inherit;text-align:left;color:inherit;text-decoration:none;background:none;border:0;line-height:26px}
.lk b{font:400 18px "Special Elite"}
.lk small{font-size:13px;white-space:nowrap}
.lk>*:first-child{cursor:pointer}.lk>*:first-child b{color:var(--red)}
.foot{max-width:560px;margin:0 auto;padding:16px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:center;gap:0 20px;color:#e9d7b5;font-size:14px}
.foot a{min-height:44px;display:inline-flex;align-items:center}
@media(prefers-reduced-motion:reduce){.front,.body,.card{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="av" data-av></div><h1 data-t="person.name"></h1><p data-t="person.bio"></p><div class="socs" data-soc></div></header>
<main class="cab" id="cab">
  <section class="drawer open">
    <button class="front" aria-expanded="true" aria-controls="d1"><small>A</small><span class="holder">My Photo Gallery</span><small>Free</small><i class="pull"></i></button>
    <div class="body" id="d1"><div><div class="cards">
      <article class="card"><span class="call">A.001</span><h2 data-t="product.name"></h2>
        <p><span class="stamp" data-t="product.price"></span><span class="stamp" style="color:#232020;border-color:#232020" data-t="product.compat"></span></p>
        <p data-t="product.description"></p><p data-t="product.promise"></p><ul data-details></ul>
        <button class="btn" data-get>Get it free</button><p class="sm" data-t="product.compatNote"></p></article>
      <article class="card"><span class="call">A.002</span><h2>Preview</h2><div data-demo></div></article>
    </div></div></div>
  </section>
  <section class="drawer">
    <button class="front" aria-expanded="false" aria-controls="d2"><small>B</small><span class="holder">Links &amp; resources</span><small>6</small><i class="pull"></i></button>
    <div class="body" id="d2"><div><div class="cards"><article class="card"><span class="call">B.001</span><h2>Links</h2><div class="lk" id="links"></div></article></div></div></div>
  </section>
  <section class="drawer">
    <button class="front" aria-expanded="false" aria-controls="d3"><small>C</small><span class="holder">Currently building</span><small>WIP</small><i class="pull"></i></button>
    <div class="body" id="d3"><div><div class="cards"><article class="card"><span class="call">C.001</span><h2 data-t="building.name"></h2><p data-t="building.status"></p><a data-build-link>Follow the journey</a></article></div></div></div>
  </section>
  <section class="drawer">
    <button class="front" aria-expanded="false" aria-controls="d4"><small>D</small><span class="holder">Newsletter</span><small>✉</small><i class="pull"></i></button>
    <div class="body" id="d4"><div><div class="cards"><article class="card"><span class="call">D.001</span><h2>Newsletter</h2><p data-t="newsletter.intro"></p><div data-form="newsletter"></div></article></div></div></div>
  </section>
</main>
<footer class="foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span style="align-self:center" data-t="footer.credit"></span></footer>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,$$,S,link,esc}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<b>${esc(l.label)}</b><small>${esc(l.note)}</small>`)).join('');
const drawers=$$('.drawer');
function sync(){drawers.forEach(d=>{const o=d.classList.contains('open');$('.front',d).setAttribute('aria-expanded',o);$('.body',d).inert=!o})}
$('#cab').addEventListener('click',e=>{const f=e.target.closest('.front');if(!f)return;const d=f.parentElement,was=d.classList.contains('open');drawers.forEach(x=>x.classList.remove('open'));if(!was){d.classList.add('open');setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),120)}sync()});
sync();
window.BIO_QA=async()=>{drawers.forEach(d=>d.classList.add('open'));sync()};
</script>
</body>
</html>
