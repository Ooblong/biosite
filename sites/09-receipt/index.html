<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#2f6df6">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128&family=Xanh+Mono&family=Inconsolata:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--blue:#2f6df6;--paper:#fbfaf4;--ink:#1c1c20;
--k-bg:#fbfaf4;--k-fg:#1c1c20;--k-muted:#55555c;--k-accent:#1c1c20;--k-on:#fbfaf4;--k-line:#1c1c20;--k-r:0;--k-font:Inconsolata,monospace;--k-display:Inconsolata,monospace;--k-dlg-r:0}
*{box-sizing:border-box}
html{background:var(--blue)}
body{margin:0;min-height:100dvh;color:var(--ink);font:16px/1.35 Inconsolata,monospace;background:var(--blue);overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.printer{position:sticky;top:0;z-index:5;height:calc(46px + env(safe-area-inset-top));background:linear-gradient(#17181d,#2b2c33);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.printer:after{content:"";position:absolute;left:50%;bottom:9px;width:min(calc(100% - 20px),430px);height:7px;transform:translateX(-50%);background:#000;border-radius:4px}
.feed{position:relative;width:min(calc(100% - 24px),420px);margin:-16px auto 0;overflow:hidden;padding:0 0 40px}
.paper{position:relative;padding:44px 20px 30px;background:var(--paper);filter:drop-shadow(0 8px 14px rgba(0,0,30,.28));
 --m:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
 -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) bottom/14px 8px repeat-x;
 mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) bottom/14px 8px repeat-x}
.feed.go .paper{animation:print 2.1s steps(26) both}
@keyframes print{from{transform:translateY(-100%)}to{transform:none}}
.ctr{text-align:center}
.av{width:72px;height:72px;margin:0 auto 8px;display:grid;place-items:center;font-weight:900;font-size:26px;border:2px solid var(--ink);border-radius:50%;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.3)}
h1{margin:0;font:900 clamp(30px,9.2vw,38px)/1 Inconsolata,monospace;letter-spacing:-.02em;text-transform:uppercase}
.b{margin:6px auto 0;max-width:30ch;font-size:15px}
.socs{display:flex;justify-content:center;gap:6px;margin-top:4px}
hr{border:0;border-top:2px dashed var(--ink);margin:16px 0}
.sec{margin:0 0 8px;font-weight:900;letter-spacing:.14em;font-size:15px;text-align:center}
.it{display:flex;align-items:baseline;gap:6px;min-height:34px}
.it>:first-child{max-width:72%}
.it i{flex:1;border-bottom:2px dotted #1c1c2066;transform:translateY(-4px)}
.it b{white-space:nowrap}
.pname{font:900 34px/1 Inconsolata,monospace;letter-spacing:-.03em;margin:4px 0 8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:34px;line-height:1}
.pay{display:block;width:100%;min-height:62px;margin:14px 0 8px;font-weight:900;font-size:24px;letter-spacing:.01em;color:var(--paper);background:var(--ink);border:0;cursor:pointer}
.pay:hover{background:var(--blue)}
.sm{font-size:14px;margin:6px 0}
.pg{--pg-bg:#fbfaf4;--pg-fg:#1c1c20;--pg-mut:#55555c;--pg-line:#1c1c20;--pg-acc:#1c1c20;--pg-on:#fbfaf4;--pg-r:0;--pg-tile-r:0;--pg-font:Inconsolata,monospace;--pg-filter:grayscale(1) contrast(1.5);margin:10px 0;font-size:14px;border-style:dashed}
.lk>*{display:flex;align-items:baseline;gap:6px;min-height:42px;width:100%;padding:4px 0;font:inherit;text-align:left;color:inherit;text-decoration:none;background:none;border:0}
.lk>* span{max-width:70%}
.lk i{flex:1;border-bottom:2px dotted #1c1c2066;transform:translateY(-4px)}
.lk b{font-weight:400;white-space:nowrap;font-size:14px}
.lk>*:first-child{font-weight:900;cursor:pointer}.lk>*:first-child b{font-weight:900}
.bar{font:400 62px/1 "Libre Barcode 128",monospace;text-align:center;margin:14px 0 0;overflow:hidden;white-space:nowrap;letter-spacing:0}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px}
.foot a{min-height:44px;display:inline-flex;align-items:center}
.k-in{background:#fff0}
.again{display:block;margin:14px auto calc(30px + env(safe-area-inset-bottom));min-height:46px;padding:0 18px;font-weight:700;color:#fff;background:none;border:2px solid #fff;cursor:pointer}
@media(prefers-reduced-motion:reduce){.feed.go .paper{animation:none}}
</style>
</head>
<body>
<div class="printer" aria-hidden="true"></div>
<div class="feed go" id="feed">
<main class="paper">
  <header class="ctr">
    <div class="av" data-av></div>
    <h1 data-t="person.name"></h1>
    <p class="b" data-t="person.bio"></p>
    <div class="socs" data-soc></div>
  </header>
  <hr>
  <section>
    <p class="sec">YOUR ORDER</p>
    <p class="pname" data-t="product.name"></p>
    <p class="sm" data-t="product.description"></p>
    <div class="it"><span>1 × <span data-t="product.kind"></span></span><i></i><b data-t="product.price"></b></div>
    <div class="it"><span>Cloud storage needed</span><i></i><b>None</b></div>
    <div class="it"><span>Subscription</span><i></i><b>None</b></div>
    <div class="it"><span>Compatibility</span><i></i><b data-t="product.compat"></b></div>
    <ul data-details class="sm"></ul>
    <hr>
    <div class="tot"><span>TOTAL</span><span data-t="product.price"></span></div>
    <button class="pay" data-get>Get it free</button>
    <p class="sm" data-t="product.compatNote"></p>
    <div data-demo></div>
  </section>
  <hr>
  <section><p class="sec">ALSO AVAILABLE</p><div class="lk" id="links"></div></section>
  <hr>
  <section><p class="sec">NOW IN PRODUCTION</p><div class="it"><span data-t="building.name"></span><i></i><b>Building</b></div><p class="sm" data-t="building.status"></p><a data-build-link>Follow the journey</a></section>
  <hr>
  <section><p class="sec">LOYALTY PROGRAMME</p><p class="sm" data-t="newsletter.intro"></p><div data-form="newsletter"></div></section>
  <hr>
  <footer class="ctr">
    <div class="foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a></div>
    <p class="sm" data-t="footer.credit"></p>
    <p class="sm">THANK YOU FOR VISITING</p>
    <div class="bar" aria-hidden="true">SairahGonzalez</div>
  </footer>
</main>
</div>
<button class="again" id="again">Print it again</button>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,S,link,esc}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<span>${esc(l.label)}</span><i></i><b>${esc(l.note)}</b>`)).join('');
$('#again').onclick=()=>{scrollTo({top:0});const f=$('#feed');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
</script>
</body>
</html>
