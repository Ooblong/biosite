<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--l1:#e8402a;--l2:#f39200;--l3:#00965e;--l4:#7b3fa0;--l5:#0072bc;--ink:#14171a;--mute:#5d646b;
--k-bg:#fff;--k-fg:#14171a;--k-muted:#5d646b;--k-accent:#0072bc;--k-on:#fff;--k-line:#14171a;--k-r:10px;--k-font:"Red Hat Display",sans-serif;--k-display:"Red Hat Display",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:500 16px/1.42 "Red Hat Display",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--l5);outline-offset:2px}
.board{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;color:#ffc93c;background:#14171a;font:500 14px "Red Hat Mono",monospace;letter-spacing:.04em}
.board b{color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .ln{flex:none;width:26px;height:26px;display:grid;place-items:center;color:#fff;background:var(--c,var(--l1));border-radius:50%;font-family:"Red Hat Display";font-weight:900;font-size:13px;transition:background .3s}
.map{position:relative;max-width:620px;margin:0 auto;padding:30px 18px 40px 72px}
.track{position:absolute;left:34px;top:0;bottom:0;width:10px;border-radius:9px;background:linear-gradient(var(--l1) 0 18%,var(--l2) 18% 46%,var(--l3) 46% 66%,var(--l4) 66% 80%,var(--l5) 80%)}
.train{position:absolute;left:27px;top:0;width:24px;height:44px;border-radius:12px;background:#14171a;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transform:translateY(var(--y,0));z-index:2;transition:transform .12s linear}
.train:after{content:"";position:absolute;left:4px;right:4px;top:5px;height:9px;border-radius:4px;background:#ffc93c}
.stop{position:relative;padding:8px 0 40px}
.stop:before{content:"";position:absolute;left:-47px;top:10px;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--ink);box-sizing:border-box;z-index:1}
.stop.x:before{width:34px;height:34px;left:-51px;top:6px;border-width:7px}
.st{margin:0 0 4px;font:500 12px "Red Hat Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font:900 clamp(40px,11.5vw,64px)/.96 "Red Hat Display",sans-serif;letter-spacing:-.03em}
h2{margin:0 0 8px;font:900 clamp(30px,8.5vw,44px)/1 "Red Hat Display",sans-serif;letter-spacing:-.025em}
.stop p{margin:0 0 10px}
.av{width:78px;height:78px;display:grid;place-items:center;margin-bottom:12px;font:900 28px "Red Hat Display";color:#fff;background:var(--l1);border-radius:50%;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.socs{display:flex;gap:6px}
.socs .k-soc{width:44px;height:44px;border-radius:50%;background:#f1f3f4}
.card{padding:16px;border:3px solid var(--l2);border-radius:18px}
.lines{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.lines span{padding:3px 10px;border-radius:99px;font-weight:900;font-size:13px;color:#fff;background:var(--l2)}
.lines span+span{background:var(--ink)}
.go{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:58px;margin:12px 0 8px;padding:0 18px;font-weight:900;font-size:19px;color:#fff;background:var(--l2);border:0;border-radius:14px;cursor:pointer}
.sm{font-size:14px;color:var(--mute)}
.pg{--pg-acc:#f39200;--pg-r:12px;--pg-font:"Red Hat Display",sans-serif;margin:10px 0}
.branch{display:grid;gap:0;margin-top:6px;border-left:6px solid var(--l3);margin-left:6px;padding-left:20px}
.branch>*{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;font:inherit;font-weight:700;text-align:left;color:inherit;text-decoration:none;background:none;border:0;border-bottom:1px solid #e8eaec;width:100%;padding:4px 0}
.branch>*:before{content:"";position:absolute;left:-33px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;border:4px solid var(--l3)}
.branch>*:first-child{color:var(--l3);cursor:pointer}
.branch small{font-weight:500;font-size:13px;color:var(--mute);white-space:nowrap}
.branch .is-soon{color:#3f464c}
.foot{display:flex;flex-wrap:wrap;gap:0 18px;align-items:center;font-size:14px}
.foot a{min-height:44px;display:inline-flex;align-items:center;font-weight:700}
@media(min-width:900px){.map{max-width:760px;padding-left:96px}.track{left:50px}.train{left:43px}.stop:before{left:-55px}.stop.x:before{left:-59px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.train{transition:none}}
</style>
</head>
<body>
<div class="board" aria-live="polite"><span class="ln" id="ln">1</span><span>Next stop</span><b id="next">My Photo Gallery</b></div>
<main class="map" id="map">
  <div class="track" aria-hidden="true"></div><div class="train" id="train" aria-hidden="true"></div>
  <section class="stop" data-c="var(--l1)" data-n="1"><p class="st">Line 1 · Start</p><div class="av" data-av></div><h1 data-t="person.name"></h1><p data-t="person.bio"></p><div class="socs" data-soc></div></section>
  <section class="stop x" data-c="var(--l2)" data-n="2" data-name="My Photo Gallery"><p class="st">Line 2 · Main interchange</p>
    <div class="card"><div class="lines"><span data-t="product.price"></span><span data-t="product.compat"></span></div>
    <h2 data-t="product.name"></h2><p data-t="product.description"></p><p><b data-t="product.promise"></b></p>
    <ul data-details></ul>
    <button class="go" data-get><span>Get it free</span><span>→</span></button>
    <p class="sm" data-t="product.compatNote"></p><div data-demo></div></div></section>
  <section class="stop" data-c="var(--l3)" data-n="3" data-name="Links"><p class="st">Line 3 · Branch line</p><h2>Links</h2><div class="branch" id="links"></div></section>
  <section class="stop" data-c="var(--l4)" data-n="4" data-name="Currently building"><p class="st">Line 4 · Under construction</p><h2 data-t="building.name"></h2><p data-t="building.status"></p><a data-build-link>Follow the journey</a></section>
  <section class="stop" data-c="var(--l5)" data-n="5" data-name="Newsletter"><p class="st">Line 5 · Terminus</p><h2>Newsletter</h2><p data-t="newsletter.intro"></p><div data-form="newsletter"></div>
    <div class="foot" style="margin-top:22px"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span class="sm" data-t="footer.credit"></span></div></section>
</main>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,$$,S,link,esc}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<span>${esc(l.label)}</span><small>${esc(l.note)}</small>`)).join('');
const stops=$$('.stop'),map=$('#map'),train=$('#train');
function upd(){const r=map.getBoundingClientRect(),mid=innerHeight*.42;const y=Math.max(0,Math.min(r.height-50,mid-r.top));train.style.setProperty('--y',y+'px');
 let cur=0;stops.forEach((s,i)=>{if(s.getBoundingClientRect().top<mid+20)cur=i});
 const nx=stops[Math.min(cur+1,stops.length-1)];const atEnd=cur===stops.length-1;
 $('#next').textContent=atEnd?'Terminus. All change.':nx.dataset.name;$('#ln').textContent=stops[cur].dataset.n;$('#ln').parentElement.style.setProperty('--c',stops[cur].dataset.c)}
addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});addEventListener('resize',upd);upd();
</script>
</body>
</html>
