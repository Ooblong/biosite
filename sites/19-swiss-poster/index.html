<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#e30613">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--red:#e30613;--ink:#111;--paper:#fff;
--k-bg:#fff;--k-fg:#111;--k-muted:#444;--k-accent:#111;--k-on:#fff;--k-line:#111;--k-r:0;--k-font:Archivo,sans-serif;--k-display:Archivo,sans-serif;--k-dlg-r:0}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity}
body{margin:0;color:var(--ink);background:var(--paper);font:400 16px/1.35 Archivo,sans-serif;font-stretch:100%}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.p{position:relative;min-height:100dvh;scroll-snap-align:start;padding:calc(20px + env(safe-area-inset-top)) 18px 28px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:min-content;align-content:space-between;gap:0 10px;overflow:hidden;background:var(--bg,var(--paper));color:var(--fg,var(--ink))}
.p:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--gl,rgba(0,0,0,.06)) 1px,transparent 1px) 18px 0/calc((100% - 36px)/6) 100%;opacity:.9}
.p>*{position:relative;z-index:1}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;font-weight:700;font-size:12px;letter-spacing:.02em;text-transform:uppercase;font-stretch:110%}
.huge{grid-column:1/-1;margin:0;font-weight:900;font-stretch:62%;line-height:.8;letter-spacing:-.02em;text-transform:uppercase;font-size:clamp(92px,30.5vw,300px)}
.jump{display:inline-flex;align-items:center;min-height:44px;margin-top:-12px;text-underline-offset:3px}
.huge span{display:block;transform:translateY(40%);opacity:0;transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .4s}
.seen .huge span{transform:none;opacity:1}
.huge span:nth-child(2){transition-delay:.08s;font-stretch:100%;font-size:.335em;letter-spacing:-.03em;margin-top:.08em}
.col{grid-column:1/-1}
.col2{grid-column:3/-1}
.h2{margin:0;font-weight:900;font-stretch:75%;text-transform:uppercase;line-height:.85;font-size:clamp(64px,20vw,170px);letter-spacing:-.01em}
.p p{margin:0 0 10px}
.lead{font-size:19px;line-height:1.25;font-weight:500}
.av{width:100%;aspect-ratio:1;display:grid;place-items:center;font-weight:900;font-stretch:62%;font-size:46px;color:#fff;background:var(--ink);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.socs{display:flex;gap:0;margin-left:-10px}
.r{--bg:var(--red);--fg:#fff;--gl:rgba(255,255,255,.18);--k-fg:#fff;--k-line:#fff;--k-muted:#ffe2e2;--k-accent:#fff;--k-on:#e30613;--k-ok:#fff;--k-err:#fff}
.k{--bg:var(--ink);--fg:#fff;--gl:rgba(255,255,255,.12)}
.bx{display:inline-block;padding:2px 8px;margin-right:6px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:#fff;color:var(--red)}
.bx.o{background:none;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:68px;padding:0 18px;margin:8px 0 10px;font-weight:900;font-stretch:75%;font-size:34px;text-transform:uppercase;color:var(--red);background:#fff;border:0;cursor:pointer}
.big:hover{background:var(--ink);color:#fff}
.sm{font-size:13.5px}
.pg{--pg-r:0;--pg-tile-r:0;--pg-acc:#e30613;--pg-line:#111;--pg-font:Archivo,sans-serif;border-width:2px;margin:10px 0}
.lk{border-top:3px solid currentColor}
.lk>*{display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;width:100%;min-height:58px;padding:10px 0;font:inherit;text-align:left;color:inherit;text-decoration:none;background:none;border:0;border-bottom:1px solid currentColor}
.lk em{font-style:normal;font-weight:700;font-size:13px}
.lk b{font-weight:800;font-stretch:80%;font-size:26px;line-height:1;text-transform:uppercase}
.lk small{font-size:12.5px;white-space:nowrap}
.lk>*:first-child b{color:var(--red)}
.lk button{cursor:pointer}
.rot{position:absolute!important;right:4px;top:50%;writing-mode:vertical-rl;transform:rotate(180deg) translateX(-50%);font-weight:900;font-stretch:125%;font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
.foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0 20px;border-top:3px solid #fff;padding-top:8px}
.foot a{min-height:44px;display:inline-flex;align-items:center;font-weight:700}
@media(min-width:900px){.p{padding:28px 36px 36px;grid-template-columns:repeat(12,1fr);gap:0 18px}.p:after{background-position:36px 0;background-size:calc((100% - 72px)/12) 100%}.col{grid-column:span 6}.col2{grid-column:7/-1}.huge{font-size:min(26vw,330px)}}
@media(prefers-reduced-motion:reduce){.huge span{transform:none;opacity:1;transition:none}}
</style>
</head>
<body>
<section class="p">
  <div class="meta"><span style="align-self:center">Link in bio</span><a class="jump" href="#feat">My Photo Gallery, free ↓</a></div>
  <h1 class="huge"><span data-t="person.first"></span><span data-t="person.last"></span></h1>
  <div class="col" style="display:grid;grid-template-columns:1fr 2fr;gap:14px;align-items:end">
    <div class="av" data-av></div>
    <div><p class="lead" data-t="person.bio"></p><div class="socs" data-soc></div></div>
  </div>
</section>
<section class="p r" id="feat">
  <div class="meta"><span data-t="product.kind"></span><span>Featured</span></div>
  <h2 class="h2 col" style="grid-column:1/-1;margin:20px 0" data-t="product.name"></h2>
  <div class="col">
    <p><span class="bx" data-t="product.price"></span><span class="bx o" data-t="product.compat"></span></p>
    <p class="lead" data-t="product.description"></p><p style="font-weight:800" data-t="product.promise"></p><ul data-details></ul>
    <button class="big" data-get><span>Get it free</span><span>→</span></button>
    <p class="sm" data-t="product.compatNote"></p>
  </div>
  <div class="col2" style="grid-column:1/-1"><div data-demo></div></div>
  <span class="rot">Free · Free · Free</span>
</section>
<section class="p">
  <div class="meta"><span>Index</span><span>Links</span></div>
  <h2 class="h2" style="grid-column:1/-1;margin:20px 0">Links</h2>
  <div class="lk col" id="links" style="grid-column:1/-1"></div>
</section>
<section class="p k">
  <div class="meta"><span>Currently building</span><span>In progress</span></div>
  <h2 class="h2" style="grid-column:1/-1;margin:20px 0;color:var(--red)" data-t="building.name"></h2>
  <div class="col"><p class="lead" data-t="building.status"></p><a data-build-link>Follow the journey</a></div>
</section>
<section class="p r">
  <div class="meta"><span>Newsletter</span><span>By email</span></div>
  <h2 class="h2" style="grid-column:1/-1;margin:20px 0">Stay in touch</h2>
  <div class="col"><p class="lead" data-t="newsletter.intro"></p><div data-form="newsletter"></div></div>
  <footer class="foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span style="align-self:center" data-t="footer.credit"></span></footer>
</section>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,$$,S,link,esc}=BIO;
$('#links').innerHTML=S.links.map((l,i)=>link(l,`<em>${String(i+1).padStart(2,'0')}</em><b>${esc(l.label)}</b><small>${esc(l.note)}</small>`)).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('seen')}),{threshold:.2});
$$('.p').forEach(p=>io.observe(p));
</script>
</body>
</html>
