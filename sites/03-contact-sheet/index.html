<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#dfeaf3">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Rock+Salt&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--light:#e8f1f7;--film:#17120e;--edge:#f2a33a;--pencil:#e0261b;--frame:#2a241f;
--k-bg:#17120e;--k-fg:#f3ede4;--k-muted:#c9bdac;--k-accent:#f2a33a;--k-on:#17120e;--k-line:#6d6050;--k-r:2px;--k-font:"IBM Plex Mono",monospace;--k-display:Oswald,sans-serif;--k-err:#ff9a8d;--k-ok:#f2a33a}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 40% 10%,#fff,var(--light) 55%,#c7d8e4);font:14px/1.5 "IBM Plex Mono",monospace;color:var(--k-fg);overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--edge);outline-offset:2px}
.sheet{position:relative;max-width:560px;margin:0 auto;padding:18px 10px 60px}
.scrawl{font:400 17px "Rock Salt",cursive;color:var(--pencil);transform:rotate(-2deg);margin:10px 8px 18px;line-height:1.4}
.strip{position:relative;background:var(--film);padding:0 30px;margin:0 0 18px;box-shadow:0 6px 18px rgba(30,40,50,.28);transform:rotate(var(--t,0deg))}
.strip:before,.strip:after{content:"";position:absolute;top:0;bottom:0;width:16px;background:radial-gradient(circle,transparent 0,transparent 0) ,repeating-linear-gradient(180deg,#e9f2f8 0 12px,transparent 12px 26px);border-radius:0}
.strip:before{left:7px}.strip:after{right:7px}
.fr{position:relative;display:block;padding:22px 16px 20px;margin:0;background:var(--frame);border-top:9px solid var(--film);border-bottom:9px solid var(--film)}
.num{position:absolute;left:8px;top:-9px;font:600 10px "IBM Plex Mono",monospace;line-height:9px;color:var(--edge);letter-spacing:.08em}
.num.r{left:auto;right:8px}
.hero{display:grid;gap:14px;background:linear-gradient(160deg,#3b2f28,#201a15)}
.av{width:100%;aspect-ratio:3/2;display:grid;place-items:center;font:600 86px Oswald,sans-serif;color:#17120e;background:#ded3c4;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font:600 clamp(46px,14.5vw,72px)/.98 Oswald,sans-serif;text-transform:uppercase;letter-spacing:-.005em}
h2{margin:0 0 8px;font:600 clamp(34px,10vw,46px)/1 Oswald,sans-serif;text-transform:uppercase}
.fr p{margin:0 0 10px}
.socs{display:flex;gap:4px;margin:-6px 0 -10px -10px}
.picked{position:relative;background:linear-gradient(160deg,#3a3027,#241d18)}
.circle{position:absolute;inset:-4px -8px -6px;width:calc(100% + 16px);height:calc(100% + 10px);pointer-events:none;z-index:3;overflow:visible}
.circle path{fill:none;stroke:var(--pencil);stroke-width:4.5;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.circle.on path{animation:draw 1.6s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pick-note{position:absolute;right:6px;top:8px;z-index:4;font:400 14px "Rock Salt",cursive;color:var(--pencil);transform:rotate(5deg);background:#fff;padding:0 6px}
.tag{display:inline-block;padding:1px 7px;margin-right:6px;font-weight:600;font-size:12px;color:#17120e;background:var(--edge)}
.tag.o{color:var(--edge);background:none;box-shadow:inset 0 0 0 1px var(--edge)}
.btn{display:block;width:100%;min-height:58px;margin:12px 0 8px;font:600 22px Oswald,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#17120e;background:var(--edge);border:0;cursor:pointer}
.sm{font-size:12.5px;color:var(--k-muted)}
.pg{--pg-bg:#0f0c09;--pg-fg:#f3ede4;--pg-mut:#c9bdac;--pg-line:#4a4036;--pg-acc:#f2a33a;--pg-on:#17120e;--pg-r:0;--pg-tile-r:0;--pg-font:"IBM Plex Mono",monospace;margin:10px 0}
.lk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lk>*{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:82px;padding:9px;font:inherit;text-align:left;text-decoration:none;color:inherit;background:#3b332b;border:0}
.lk>*:first-child{grid-column:1/-1;background:var(--edge);color:#17120e;cursor:pointer;min-height:64px}
.lk b{font:600 19px/1.08 Oswald,sans-serif;text-transform:uppercase}
.lk small{font-size:11.5px}
.foot{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin:0;font-size:13px}
.foot a{min-height:44px;display:inline-flex;align-items:center}
.loupe{position:fixed;width:150px;height:150px;left:0;top:0;border-radius:50%;overflow:hidden;z-index:30;border:7px solid #1b1b1b;box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 26px rgba(0,0,0,.4);background:var(--light);touch-action:none;cursor:grab;display:none}
.loupe.on{display:block}
.loupe .in{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;background:radial-gradient(circle at 40% 10%,#fff,var(--light) 55%,#c7d8e4)}
.lbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:31;min-height:48px;padding:0 16px;font-weight:600;color:#fff;background:#1b1b1b;border:0;border-radius:99px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
@media(min-width:900px){.sheet{max-width:1180px;columns:3;column-gap:22px;padding:30px 24px 70px}.strip{break-inside:avoid}.scrawl{column-span:all}}
@media(prefers-reduced-motion:reduce){.circle path{stroke-dashoffset:0;animation:none!important}}
</style>
</head>
<body>
<main class="sheet" id="sheet">
  <p class="scrawl">Sheet no.1. Best frame circled.</p>
  <section class="strip" style="--t:-.4deg">
    <div class="fr hero"><span class="num">1</span><span class="num r">SAFETY FILM</span>
      <div class="av" data-av></div>
      <h1 data-t="person.name"></h1>
      <p data-t="person.bio"></p>
      <div class="socs" data-soc></div>
    </div>
  </section>
  <section class="strip" style="--t:.3deg">
    <div class="fr picked"><span class="num">2A</span>
      <svg class="circle" id="circle" viewBox="0 0 100 100" preserveAspectRatio="none"><path pathLength="1" d="M8 7 C30 0,74 -1,95 7 C101 34,100 72,95 94 C70 101,28 101,6 94 C-1 66,0 28,10 4"/></svg>
      <span class="pick-note">this one!</span>
      <p><span class="tag" data-t="product.price"></span><span class="tag o" data-t="product.compat"></span></p>
      <h2 data-t="product.name"></h2>
      <p data-t="product.description"></p><p data-t="product.promise"></p>
      <div data-demo></div>
      <ul data-details></ul>
      <button class="btn" data-get>Get it free</button>
      <p class="sm" data-t="product.compatNote"></p>
    </div>
  </section>
  <section class="strip" style="--t:-.2deg">
    <div class="fr"><span class="num">3</span><h2>Links</h2><div class="lk" id="links"></div></div>
  </section>
  <section class="strip" style="--t:.5deg">
    <div class="fr"><span class="num">4A</span><p class="sm">Currently building</p><h2 data-t="building.name"></h2><p data-t="building.status"></p><a data-build-link>Follow the journey</a></div>
    <div class="fr"><span class="num">5</span><h2>Newsletter</h2><p data-t="newsletter.intro"></p><div data-form="newsletter"></div></div>
    <div class="fr"><span class="num">5A</span><div class="foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span data-t="footer.credit"></span></div></div>
  </section>
</main>
<button class="lbtn" id="lb" aria-pressed="false">Use the loupe</button>
<div class="loupe" id="lp" aria-hidden="true"><div class="in" id="lin"></div></div>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,$$,S,link,esc}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<b>${esc(l.label)}</b><small>${esc(l.note)}</small>`)).join('');
new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){$('#circle').classList.add('on');o.disconnect()}},{threshold:.15}).observe($('#circle').parentElement);
// Loupe: a live 2× copy of the sheet you can drag around
const lp=$('#lp'),lin=$('#lin'),ZOOM=2;let built=false,on=false,px=innerWidth/2,py=innerHeight/2;
function build(){const c=$('#sheet').cloneNode(true);c.removeAttribute('id');c.inert=true;c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));lin.innerHTML='';lin.append(c);built=true}
function place(){const R=75;lp.style.transform=`translate(${px-R}px,${py-R}px)`;const s=$('#sheet').getBoundingClientRect();lin.style.width=s.width+'px';lin.style.transform=`translate(${R-(px-s.left)*ZOOM}px,${R-(py-s.top)*ZOOM}px) scale(${ZOOM})`}
$('#lb').onclick=e=>{on=!on;if(on&&!built)build();lp.classList.toggle('on',on);e.currentTarget.textContent=on?'Put the loupe away':'Use the loupe';e.currentTarget.setAttribute('aria-pressed',on);px=innerWidth/2;py=innerHeight*.45;place()};
let drag=false;
lp.addEventListener('pointerdown',e=>{drag=true;lp.setPointerCapture(e.pointerId)});
lp.addEventListener('pointermove',e=>{if(drag){px=e.clientX;py=e.clientY;place()}});
lp.addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(on&&e.pointerType==='mouse'&&!e.target.closest('#lb')){px=e.clientX;py=e.clientY;place()}},{passive:true});
addEventListener('scroll',()=>on&&place(),{passive:true});
</script>
</body>
</html>
