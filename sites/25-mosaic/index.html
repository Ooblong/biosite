<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#1c0f16">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400;1,6..96,800&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--plum:#1c0f16;--plum2:#2a1820;--bone:#f1e8de;--champ:#d8b98a;--mute:#bba99c;
--k-bg:#2a1820;--k-fg:#f1e8de;--k-muted:#bba99c;--k-accent:#d8b98a;--k-on:#1c0f16;--k-line:rgba(241,232,222,.35);--k-r:0;--k-font:Jost,sans-serif;--k-display:"Bodoni Moda",serif;--k-ok:#d8b98a;--k-err:#ffb4a8;--k-dlg-r:0}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:var(--bone);font:300 16px/1.6 Jost,sans-serif;background:var(--plum);overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1px solid var(--champ);outline-offset:4px}
.hero{position:relative;height:min(78dvh,680px);display:grid;place-items:end center;padding-bottom:36px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.hero h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sur{position:relative;margin:0;font:400 12.5px Jost;letter-spacing:.6em;text-transform:uppercase;color:var(--champ);text-align:center;padding-left:.6em}
.cue{position:relative;margin:10px 0 0;font-size:12px;color:var(--mute);text-align:center}
.peek{position:relative;display:flex;justify-content:center;align-items:center;min-height:44px;margin:8px auto 0;width:max-content;padding:0 18px;font:italic 400 18px "Bodoni Moda",serif;color:var(--plum);background:var(--champ);text-decoration:none}
.wrap{max-width:620px;margin:0 auto;padding:0 22px}
.intro{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:26px 0;border-top:1px solid var(--k-line);border-bottom:1px solid var(--k-line)}
.av{width:78px;height:78px;display:grid;place-items:center;font:italic 400 30px "Bodoni Moda",serif;color:var(--plum);background:var(--champ);border-radius:50%;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.intro p{margin:0;font-size:17px}
.socs{display:flex;gap:6px;margin:6px 0 0 -10px;color:var(--champ)}
sec,.sec{display:block;padding:54px 0 0}
.eyebrow{margin:0 0 10px;font:400 12px Jost;letter-spacing:.3em;text-transform:uppercase;color:var(--champ)}
h2{margin:0 0 14px;font:400 clamp(42px,12vw,68px)/.98 "Bodoni Moda",serif;letter-spacing:-.02em}
h2 em{font-style:italic;color:var(--champ)}
.sec p{margin:0 0 12px}
.lbl{display:flex;gap:16px;margin:0 0 18px;font:400 13px Jost;letter-spacing:.14em;text-transform:uppercase}
.lbl span:first-child{color:var(--plum);background:var(--champ);padding:2px 10px}
.lbl span:last-child{border-bottom:1px solid var(--champ)}
.cta{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:62px;margin:18px 0 10px;padding:0 22px;font:italic 400 24px "Bodoni Moda",serif;color:var(--plum);background:var(--champ);border:0;cursor:pointer;transition:letter-spacing .4s}
.cta:hover{letter-spacing:.02em}
.sm{font-size:14px;color:var(--mute)}
.pg{--pg-bg:#140a10;--pg-fg:#f1e8de;--pg-mut:#bba99c;--pg-line:#4a3540;--pg-acc:#d8b98a;--pg-on:#1c0f16;--pg-r:0;--pg-tile-r:0;--pg-font:Jost,sans-serif;margin-top:22px}
.lk{border-top:1px solid var(--k-line)}
.lk>*{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;min-height:62px;padding:14px 0;font:inherit;text-align:left;color:inherit;text-decoration:none;background:none;border:0;border-bottom:1px solid var(--k-line)}
.lk b{font:400 24px/1.1 "Bodoni Moda",serif}
.lk small{font-size:12.5px;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
.lk>*:first-child{cursor:pointer}.lk>*:first-child b{font-style:italic;color:var(--champ)}
.foot{display:flex;flex-wrap:wrap;gap:0 22px;margin:70px 0 0;padding:20px 0 calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--k-line);font-size:14px;color:var(--mute)}
.foot a{min-height:44px;display:inline-flex;align-items:center;color:var(--bone)}
@media(min-width:900px){.wrap{max-width:780px}}
</style>
</head>
<body>
<header class="hero"><canvas id="cv" aria-hidden="true"></canvas><h1 data-t="person.name"></h1><div><p class="sur" data-t="person.last"></p><p class="cue" id="cue">Every tile is a picture. Touch to scatter them.</p><a class="peek" href="#feat">My Photo Gallery · Free ↓</a></div></header>
<main class="wrap">
  <div class="intro"><div class="av" data-av></div><div><p data-t="person.bio"></p><div class="socs" data-soc></div></div></div>
  <section class="sec" id="feat"><p class="eyebrow">Featured</p><h2 data-t="product.name"></h2>
    <div class="lbl"><span data-t="product.price"></span><span data-t="product.compat"></span></div>
    <p style="font-size:19px" data-t="product.description"></p><p data-t="product.promise"></p><ul data-details></ul>
    <button class="cta" data-get><span>Get it free</span><span>→</span></button>
    <p class="sm" data-t="product.compatNote"></p><div data-demo></div></section>
  <section class="sec"><p class="eyebrow">Index</p><h2>Links <em>&amp;</em> resources</h2><div class="lk" id="links"></div></section>
  <section class="sec"><p class="eyebrow">Currently building</p><h2><em data-t="building.name"></em></h2><p data-t="building.status"></p><a data-build-link>Follow the journey</a></section>
  <section class="sec"><p class="eyebrow">Newsletter</p><h2>Letters, <em>occasionally</em></h2><p data-t="newsletter.intro"></p><div data-form="newsletter"></div></section>
  <footer class="foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span style="align-self:center" data-t="footer.credit"></span></footer>
</main>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,S,link,esc,reduced}=BIO;
$('#links').innerHTML=S.links.map(l=>link(l,`<b>${esc(l.label)}</b><small>${esc(l.note)}</small>`)).join('');
// Name drawn from hundreds of tiny "photos": colours sampled from the sample-picture palettes
const PAL=['#ffb36b','#ff6f6f','#a14a6b','#9fd8ff','#46627c','#c75c8a','#ffd9a0','#5fa374','#7cc2b1','#ffd1dc','#7b5a86','#f7a34b','#c9702e','#2e7ea1','#3fa6b8','#ff8f5a','#b0568c','#ffe08a'];
const cv=$('#cv'),cx=cv.getContext('2d');let W,H,dpr,pts=[],px=-1e4,py=-1e4,t0;
async function build(){await document.fonts.load('italic 800 100px "Bodoni Moda"');
 dpr=Math.min(2,devicePixelRatio);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
 const o=document.createElement('canvas'),oc=o.getContext('2d');o.width=W;o.height=H;
 let fs=Math.min(W*.3,H*.42);oc.font=`italic 800 ${fs}px "Bodoni Moda"`;const w=oc.measureText(S.person.first).width;if(w>W*.9){fs*=W*.9/w;oc.font=`italic 800 ${fs}px "Bodoni Moda"`}
 oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';oc.fillText(S.person.first,W/2,H*.44);
 const d=oc.getImageData(0,0,W,H).data,step=W<500?4:6;pts=[];
 for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128)pts.push({tx:x,ty:y,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,c:PAL[(Math.random()*PAL.length)|0],s:step-.5});
 t0=performance.now();if(reduced)pts.forEach(p=>{p.x=p.tx;p.y=p.ty})}
function frame(now){cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 const k=Math.min(1,(now-t0)/1600);
 for(const p of pts){const dx=p.x-px,dy=p.y-py,d2=dx*dx+dy*dy;if(d2<6400){const f=(6400-d2)/6400*2.2;p.vx+=dx/Math.sqrt(d2+1)*f;p.vy+=dy/Math.sqrt(d2+1)*f}
  p.vx+=(p.tx-p.x)*.02*k;p.vy+=(p.ty-p.y)*.02*k;p.vx*=.86;p.vy*=.86;p.x+=p.vx;p.y+=p.vy;
  cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}
 if(!reduced)requestAnimationFrame(frame)}
const mv=e=>{const r=cv.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top};
cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);cv.addEventListener('pointerleave',()=>{px=py=-1e4});cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')setTimeout(()=>{px=py=-1e4},250)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>build().then(()=>reduced&&frame(0)),200)});
if(reduced)$('#cue').textContent='Every tile is a picture.';
build().then(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
