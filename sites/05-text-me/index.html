<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Sairah González</title>
<meta name="description" content="Sairah González. Get My Photo Gallery, a free desktop app.">
<meta name="theme-color" content="#fbf7ff">
<link rel="icon" href="../../shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{--bg:#fbf7ff;--in:#efeaf6;--ink:#231a33;--mute:#5f5670;
--k-bg:#fff;--k-fg:#231a33;--k-muted:#5f5670;--k-accent:#6d28ff;--k-on:#fff;--k-line:#cbbfdc;--k-r:18px;--k-font:Nunito,sans-serif;--k-display:Nunito,sans-serif;--k-ok:#0f7a4d;--k-err:#b3123b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.32 Nunito,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #6d28ff;outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:auto;background:var(--bg);position:relative}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(251,247,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid #ece4f6;z-index:3}
.av{width:42px;height:42px;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,#ff3d81,#6d28ff);border-radius:50%;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.top strong{display:block;font-weight:900;font-size:17px;line-height:1.1}
.top small{color:var(--mute);font-size:13px}
.socs{margin-left:auto;display:flex;color:#6d28ff}
.socs .k-soc{min-width:38px}
.log{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.day{align-self:center;margin:4px 0 10px;font-size:12.5px;color:var(--mute);font-weight:800}
.m{max-width:82%;padding:9px 14px;border-radius:21px;animation:pop .34s cubic-bezier(.2,1.3,.4,1) both;transform-origin:0 100%;word-wrap:break-word}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}}
.them{align-self:flex-start;background:var(--in);border-bottom-left-radius:6px}
.me{align-self:flex-end;margin:8px 0;color:#fff;transform-origin:100% 100%;border-bottom-right-radius:6px;background:linear-gradient(180deg,#ff3d81,#ff7a2f 35%,#a22cff 72%,#3f3dff);background-attachment:fixed}
.m+.me{margin-top:10px}
.me+.them{margin-top:6px}
.big{font-size:42px;line-height:1;padding:4px;background:none}
.card{width:min(100%,340px);max-width:90%;padding:0;background:#fff;box-shadow:0 8px 28px rgba(80,40,140,.14);overflow:hidden;border-radius:22px;border-bottom-left-radius:6px}
.card .in{padding:14px}
.card h2{margin:6px 0 4px;font-weight:900;font-size:26px;line-height:1.05;letter-spacing:-.01em}
.card p{margin:0 0 8px;font-size:15px}
.tags{display:flex;gap:6px}
.t{padding:2px 9px;font-weight:900;font-size:12.5px;border-radius:99px;color:#fff;background:#6d28ff}
.t.o{color:#4b1fb0;background:#eee5ff}
.go{display:block;width:100%;min-height:50px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(90deg,#ff3d81,#6d28ff);border:0;border-radius:15px;cursor:pointer}
.pv{display:block;width:100%;min-height:44px;margin-top:6px;font-weight:800;color:#4b1fb0;background:none;border:0;cursor:pointer}
.heroimg{height:150px;display:block}.heroimg svg{width:100%;height:100%;display:block}
.sm{font-size:13px!important;color:var(--mute)}
.lk{display:grid}
.lk>*{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:50px;padding:6px 14px;text-decoration:none;color:inherit;background:none;border:0;border-top:1px solid #efe9f6;text-align:left;font-weight:800;width:100%}
.lk>*:first-child{border-top:0;color:#6d28ff;cursor:pointer}
.lk small{font-weight:600;font-size:12.5px;color:var(--mute);white-space:nowrap}
.dots{display:flex;gap:4px;padding:13px 14px}
.dots i{width:8px;height:8px;border-radius:50%;background:#8d82a0;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
.tray{flex:none;padding:8px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #ece4f6}
.lab{margin:0 12px 6px;font-size:12.5px;color:var(--mute);font-weight:800}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;padding:0 15px;font-weight:800;font-size:15px;color:#4b1fb0;background:#fff;border:1.5px solid #cdbbf2;border-radius:99px;cursor:pointer;white-space:nowrap}
.chips button.hot{color:#fff;background:#6d28ff;border-color:#6d28ff}
.chips button:active{transform:scale(.95)}
.pg{--pg-r:0;border:0;--pg-acc:#6d28ff;--pg-font:Nunito,sans-serif}
.foot a{color:#4b1fb0}
.foot{font-size:14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.foot a{min-height:40px;display:inline-flex;align-items:center}
@media(min-width:900px){body{background:linear-gradient(135deg,#ffe2ee,#e7e0ff)}.app{height:min(860px,94dvh);margin-top:max(3dvh,12px);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(70,30,130,.25)}}
@media(prefers-reduced-motion:reduce){.m{animation:none}.log{scroll-behavior:auto}.dots i{animation:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="av" data-av></div><div><strong data-t="person.name"></strong><small>Automatic replies</small></div><div class="socs" data-soc></div></header>
  <div class="log" id="log" role="log" aria-live="polite"><span class="day">Pick a question below</span></div>
  <div class="tray"><p class="lab" id="lab">Ask about</p><div class="chips" id="chips"></div></div>
</main>
<script src="../../shared/content.js"></script>
<script src="../../shared/kit.js"></script>
<script>
const {$,$$,S,art,link,esc,reduced,hydrate}=BIO;const log=$('#log'),chips=$('#chips');
const P=S.product;
const TOPICS={
 product:{q:`What's ${P.name}?`,hot:1,a:[()=>`It's my free desktop app.`,()=>`<div class="in"></div>`]},
 preview:{q:'Show me a preview'},get:{q:'Get it free',hot:1},links:{q:'Links'},build:{q:'What are you building?'},news:{q:'Newsletter'},who:{q:'Who are you?'},contact:{q:'Contact & privacy'}
};
const productCard=()=>`<div class="m them card"><span class="heroimg">${art(0,420,220)}</span><div class="in"><div class="tags"><span class="t">${esc(P.price)}</span><span class="t o">${esc(P.compat)}</span></div><h2>${esc(P.name)}</h2><p>${esc(P.description)}</p><p>${esc(P.promise)}</p>${P.details.length?`<ul>${P.details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<button class="go" data-get>Get it free</button><button class="pv" data-chip="preview">Show me a preview</button><p class="sm" style="margin:6px 0 0">${esc(P.compatNote)}</p></div></div>`;
const R={
 who:()=>[`I'm ${esc(S.person.name)}.`,esc(S.person.bio)],
 product:()=>[`Here it is 👇`,{html:productCard()}],
 preview:()=>[`This is an illustrative preview with sample files. Try searching.`,{html:`<div class="m them card"><div data-demo></div></div>`}],
 get:()=>[esc(S.download.intro),{html:`<div class="m them card"><div class="in"><div data-form="download"></div><p class="sm" style="margin:8px 0 0">${esc(P.compatNote)}</p></div></div>`}],
 links:()=>[`Here's everything so far.`,{html:`<div class="m them card"><div class="lk">${S.links.map(l=>link(l,`<span>${esc(l.label)}</span><small>${esc(l.note)}</small>`)).join('')}</div></div>`}],
 build:()=>[`Currently building: <b>${esc(S.building.name)}</b>`,esc(S.building.status)+(S.building.url?` <a href="${esc(S.building.url)}" target="_blank" rel="noopener">Follow the journey</a>`:'')],
 news:()=>[esc(S.newsletter.intro),{html:`<div class="m them card"><div class="in"><div data-form="newsletter"></div></div></div>`}],
 contact:()=>[{html:`<div class="m them card"><div class="in foot"><a data-contact>Contact</a><a data-privacy>Privacy policy</a><span class="sm">${esc(S.footer.credit)}</span></div></div>`}]
};
const asked=new Set();
const sleep=ms=>new Promise(r=>setTimeout(r,reduced?0:ms));
const bottom=()=>{log.scrollTop=log.scrollHeight};
function add(html){const t=document.createElement('template');t.innerHTML=html.trim();const n=t.content.firstChild;log.append(n);hydrate(n);bottom();return n}
function drawChips(){const order=['product','get','preview','links','build','news','who','contact'].filter(k=>!asked.has(k)||k==='get');
 chips.innerHTML=order.map(k=>`<button data-chip="${k}" class="${TOPICS[k].hot?'hot':''}">${esc(TOPICS[k].q)}</button>`).join('');chips.scrollLeft=0}
let busy=false;
async function ask(k,silent){if(busy)return;busy=true;asked.add(k);if(!silent)add(`<div class="m me">${esc(TOPICS[k].q)}</div>`);chips.style.opacity=.5;
 for(const part of R[k]()){const d=add(`<div class="m them dots" aria-hidden="true"><i></i><i></i><i></i></div>`);await sleep(typeof part==='string'?520:640);d.remove();add(typeof part==='string'?`<div class="m them">${part}</div>`:part.html)}
 chips.style.opacity=1;drawChips();busy=false}
document.addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(b)ask(b.dataset.chip)});
(async()=>{drawChips();await sleep(350);await ask('who',true);await ask('product',true)})();
window.BIO_QA=async()=>{for(const k of ['preview','get','links','build','news','contact']){while(busy)await new Promise(r=>setTimeout(r,60));await ask(k)}};
</script>
</body>
</html>
